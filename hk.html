<script>(() => {
  // src/game/arcade.ts
  var WORLD_W = 480;
  var WORLD_H = 720;
  var GROUND_TOP = 548;
  var SPEED = 300;
  var idle = {
    left: false,
    right: false,
    up: false,
    down: false,
    fire: false,
    roll: false
  };
  function hit(ax, ay, aw, ah, bx, by, bw, bh) {
    return Math.abs(ax - bx) < (aw + bw) / 2 && Math.abs(ay - by) < (ah + bh) / 2;
  }
  var Arcade = class {
    mode = "title";
    score = 0;
    best = 0;
    lives = 3;
    rolls = 2;
    wave = 1;
    scroll = 0;
    weapon = 1;
    airport = 22;
    runway = 0;
    bannerText = "";
    player = { x: WORLD_W / 2, y: 460, vx: 0, vy: 0 };
    rollT = 0;
    inv = 0;
    shotCd = 0;
    shake = 0;
    hurtFlash = 0;
    banner = 0;
    waiting = true;
    spawnDelay = 0;
    bullets = [];
    ebullets = [];
    enemies = [];
    sparks = [];
    smoke = [];
    rings = [];
    muzzles = [];
    booms = [];
    pickups = [];
    troops = [];
    foes = [];
    islands = [];
    boss = null;
    onMode = null;
    rollHeld = false;
    foeSpawn = 2.2;
    reinforce = 5;
    beep = null;
    constructor() {
      try {
        this.best = Number(localStorage.getItem("pacific-sweep-best") || 0) || 0;
      } catch {
        this.best = 0;
      }
      for (let i = 0; i < 5; i++) {
        this.islands.push({
          x: 36 + Math.random() * (WORLD_W - 72),
          y: Math.random() * GROUND_TOP,
          r: 18 + Math.random() * 28
        });
      }
      this.seedArmy();
    }
    setBeep(fn) {
      this.beep = fn;
    }
    setMode(mode) {
      this.mode = mode;
      this.onMode?.(mode);
    }
    seedArmy() {
      this.troops = [
        { x: 36, hp: 4, cool: 0.2, heavy: false },
        { x: 68, hp: 4, cool: 0.4, heavy: false },
        { x: 102, hp: 6, cool: 0.1, heavy: true }
      ];
      this.foes = [
        { x: 340, hp: 3, cool: 0.3, kind: "soldier" },
        { x: 378, hp: 3, cool: 0.5, kind: "soldier" },
        { x: 420, hp: 8, cool: 0.4, kind: "tank" }
      ];
      this.airport = 22;
      this.runway = 0;
      this.foeSpawn = 2.4;
      this.reinforce = 6;
    }
    start() {
      this.score = 0;
      this.lives = 3;
      this.rolls = 2;
      this.wave = 1;
      this.weapon = 1;
      this.player.x = WORLD_W / 2;
      this.player.y = 430;
      this.player.vx = 0;
      this.player.vy = 0;
      this.rollT = 0;
      this.inv = 1.1;
      this.shotCd = 0;
      this.shake = 0;
      this.hurtFlash = 0;
      this.bullets = [];
      this.ebullets = [];
      this.enemies = [];
      this.sparks = [];
      this.smoke = [];
      this.rings = [];
      this.muzzles = [];
      this.booms = [];
      this.pickups = [];
      this.boss = null;
      this.waiting = true;
      this.spawnDelay = 0.35;
      this.banner = 1.6;
      this.bannerText = "HONG KONG";
      this.rollHeld = false;
      this.seedArmy();
      this.setMode("play");
    }
    step(dt, actions = idle) {
      this.scroll += dt * (48 + this.wave * 4);
      for (const isl of this.islands) {
        isl.y += dt * 42;
        if (isl.y - isl.r > GROUND_TOP) {
          isl.y = -isl.r;
          isl.x = 36 + Math.random() * (WORLD_W - 72);
        }
      }
      if (this.shake > 0) this.shake = Math.max(0, this.shake - dt);
      if (this.hurtFlash > 0) this.hurtFlash = Math.max(0, this.hurtFlash - dt);
      if (this.banner > 0) this.banner = Math.max(0, this.banner - dt);
      this.driftFx(dt);
      this.stepGround(dt);
      if (this.mode !== "play") return;
      const p = this.player;
      let mx = 0;
      let my = 0;
      if (actions.left) mx -= 1;
      if (actions.right) mx += 1;
      if (actions.up) my -= 1;
      if (actions.down) my += 1;
      const len = Math.hypot(mx, my);
      if (len > 0) {
        p.vx = mx / len * SPEED;
        p.vy = my / len * SPEED;
      } else {
        p.vx = 0;
        p.vy = 0;
      }
      p.x = Math.max(24, Math.min(WORLD_W - 24, p.x + p.vx * dt));
      p.y = Math.max(48, Math.min(GROUND_TOP - 36, p.y + p.vy * dt));
      if (this.rollT > 0) this.rollT = Math.max(0, this.rollT - dt);
      if (this.inv > 0) this.inv = Math.max(0, this.inv - dt);
      if (actions.roll && !this.rollHeld && this.rollT === 0 && this.rolls > 0) {
        this.rolls -= 1;
        this.rollT = 0.48;
        this.inv = 0.48;
        this.beep?.(520, 0.12, 0.05);
      }
      this.rollHeld = actions.roll;
      this.shotCd = Math.max(0, this.shotCd - dt);
      if (actions.fire && this.shotCd === 0 && this.rollT === 0) this.fireGuns();
      if (this.rollT === 0 && Math.random() < 0.4) this.puff(p.x, p.y + 34, 7);
      if (this.waiting) {
        this.spawnDelay -= dt;
        if (this.spawnDelay <= 0) {
          this.spawnWave();
          this.waiting = false;
        }
      } else if (!this.boss && this.enemies.length === 0) {
        this.wave += 1;
        this.waiting = true;
        this.spawnDelay = 0.75;
        this.banner = 1.15;
        this.bannerText = `WAVE ${this.wave}`;
        if (this.wave % 4 === 0) this.rolls = Math.min(4, this.rolls + 1);
      }
      for (const b of this.bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }
      this.bullets = this.bullets.filter((b) => !b.dead && b.y > -30 && b.x > -20 && b.x < WORLD_W + 20);
      const bulletSpeed = 230 + this.wave * 16;
      for (const e of this.enemies) {
        e.t += dt;
        const speed = (e.kind === "bomber" ? 78 : e.kind === "ace" ? 145 : 118) + this.wave * 4;
        e.y += speed * dt;
        e.x += Math.sin(e.t * (e.kind === "ace" ? 3.1 : 1.8)) * e.amp * dt;
        e.x = Math.max(24, Math.min(WORLD_W - 24, e.x));
        e.cool -= dt;
        const cool = Math.max(0.38, (e.kind === "ace" ? 0.62 : e.kind === "bomber" ? 1.05 : 0.85) - this.wave * 0.05);
        if (e.cool <= 0 && e.y > 20 && e.y < GROUND_TOP - 70) {
          e.cool = cool;
          this.enemyShot(e.x, e.y + 16, p.x, p.y, bulletSpeed, e.kind === "ace" ? 3 : 1);
        }
        if (e.y > GROUND_TOP - 6) {
          this.strafeArmy(e.x);
          e.hp = 0;
        }
      }
      if (this.boss) {
        const b = this.boss;
        b.t += dt;
        if (b.y < 110) b.y += 48 * dt;
        b.x = WORLD_W / 2 + Math.sin(b.t * 1.15) * 160;
        b.cool -= dt;
        if (b.cool <= 0 && b.y > 36) {
          b.cool = Math.max(0.32, 0.48 - this.wave * 0.02);
          for (let i = -3; i <= 3; i++) {
            this.ebullets.push({ x: b.x + i * 18, y: b.y + 36, vx: i * 55, vy: 210 + this.wave * 8 });
          }
        }
      }
      for (const b of this.ebullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }
      this.ebullets = this.ebullets.filter((b) => b.y < GROUND_TOP + 8 && b.y > -20 && b.x > -30 && b.x < WORLD_W + 30);
      for (const item of this.pickups) {
        item.y += item.vy * dt;
        item.spin += dt * 6;
      }
      for (const item of this.pickups) {
        if (item.kind === "power" && hit(p.x, p.y, 30, 28, item.x, item.y, 18, 18)) {
          item.y = 9999;
          this.gainPower();
        } else if (item.kind === "supply" && item.y >= GROUND_TOP - 4) {
          item.y = 9999;
          this.deliverSupply(item.x);
        }
      }
      this.pickups = this.pickups.filter((item) => item.y < GROUND_TOP + 10);
      for (const b of this.bullets) {
        for (const e of this.enemies) {
          if (b.dead || e.hp <= 0) continue;
          const size = e.kind === "bomber" ? 54 : 26;
          if (hit(b.x, b.y, 8, 16, e.x, e.y, size, size * 0.7)) {
            b.dead = true;
            e.hp -= 1;
            this.burst(b.x, b.y, "#ffe7a3", 4);
            if (e.hp <= 0) this.killEnemy(e);
            else if (Math.random() < 0.22) this.drop(e.x, e.y, "power");
